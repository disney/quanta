    sql: |-
      select o.cust_id as cust_id,
             o.order_id as order_id,
             o.ship_via as ship_via,
             c.first_name as first_name
      from customers_qa as c
      inner join orders_qa as o on c.cust_id = o.cust_id
      where o.cust_id = '1'
    expect:
      columns: [cust_id, order_id, ship_via, first_name]
      rows:
        - ["1", "1001", "UPS", "Abe"]
        - ["1", "1002", "UPS", "Abe"]

